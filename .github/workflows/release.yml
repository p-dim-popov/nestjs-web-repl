name: Release

# Changesets release flow (see AGENTS.md "Releases"):
#  1. On every push to main with pending .changeset/*.md files, changesets/action
#     opens (or refreshes) a "Version Packages" pull request that bumps the
#     package versions and writes the per-package CHANGELOG.md entries.
#  2. Merging that PR pushes to main with no pending changesets, so the same
#     job publishes every package whose version is not yet on npm.
#
# The release job verifies nothing itself: it runs behind verify.yml on the
# same commit (ADR 0006). This file keeps its name because npm trusted
# publishing is keyed on `release.yml`.
#
# Human prerequisites (not agent steps):
#  - npm publish access for the @remote-repl scope and the nestjs-web-repl
#    package: either configure npm trusted publishing (OIDC) on npmjs.com for
#    this repository + `release.yml`, or set an NPM_TOKEN repository secret
#    (granular access token). With OIDC, leave the secret unset.
#  - Repository Settings > Actions > General: enable "Allow GitHub Actions to
#    create and approve pull requests", or the Version Packages PR cannot be
#    opened.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    name: Version or publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The dev Node from mise.toml; its bundled npm clears the >= 11.5.1
      # trusted-publishing floor, so there is no npm upgrade step.
      - uses: ./.github/actions/setup

      - name: Use the NPM_TOKEN secret instead of OIDC, when one is set
        if: env.NPM_TOKEN != ''
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc

      - name: Open the Version Packages PR, or publish
        id: changesets
        uses: changesets/action@v2
        with:
          # changeset:publish builds first, so the tarballs are fresh.
          version-script: npm run changeset:version
          publish-script: npm run changeset:publish
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
        env:
          NPM_CONFIG_PROVENANCE: 'true'
