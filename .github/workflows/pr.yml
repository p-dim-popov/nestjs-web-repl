name: PR

# Pull requests only. Pushes to main are verified once, by release.yml,
# through the same verify.yml (ADR 0006).

on:
  pull_request:

# A new push to a PR cancels the stale run.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
